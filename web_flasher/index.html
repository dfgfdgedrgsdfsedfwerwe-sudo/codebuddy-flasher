<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 固件烧录工具</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2129;
    --card-bg: #1a2129;
    --card-hover: #222b35;
    --accent: #22c55e;
    --primary: #22c55e;
    --accent-dim: rgba(34, 197, 94, 0.15);
    --text: #e8e6e3;
    --muted: #8b95a1;
    --border: #2d3748;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }

  /* 导航栏 */
  nav {
    background: rgba(26, 33, 41, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav h1 { font-size: 20px; font-weight: 600; }
  nav .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  nav .back-btn:hover { background: var(--card-hover); }

  /* 环境提示横幅 */
  #env-banner {
    padding: 12px 20px;
    text-align: center;
    font-weight: 600;
    display: none;
  }
  #env-banner.error { background: #7a1f1f; display: block; }
  #env-banner.ok { background: #1f5c2e; display: block; }

  /* 容器 */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

  /* ============ 首页视图 ============ */
  #home-view {}
  .hero {
    text-align: center;
    padding: 60px 0 40px;
  }
  .hero h1 {
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .hero p {
    color: var(--muted);
    font-size: 18px;
  }

  /* 分类标签 */
  .category-tabs {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .tab {
    padding: 10px 24px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s;
  }

  .tab:hover {
    background: rgba(34, 197, 94, 0.1);
  }

  .tab.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  .tab.active[data-filter="web"] {
    background: #3b82f6;
    border-color: #3b82f6;
  }

  .tab.active[data-filter="android"] {
    background: #f97316;
    border-color: #f97316;
  }

  .tab.active[data-filter="windows"] {
    background: #a855f7;
    border-color: #a855f7;
  }

  /* 项目卡片网格 */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
    margin-top: 48px;
  }
  .project-card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 2px solid transparent;
    position: relative;
  }
  .project-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 32px rgba(34, 197, 94, 0.2);
  }

  /* 卡片背景图 */
  .card-image {
    height: 240px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-image.k10-bg {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    background-image: url('images/K10.jpg'), linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    background-size: contain, cover; /* 竖图 contain 完整显示，渐变 cover 填满 */
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.dongle-bg {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    background-image: url('images/dongle.jpg'), linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    background-size: cover, cover; /* 横图 cover 填满，渐变 cover 填满 */
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.codebuddy_ai_box-bg {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    /* AI Box 用紫色渐变 + emoji 图标 */
  }
  .card-image.gif-bg {
    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    background-image: url('images/30_lvgl_Gif.jpg'), linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    background-size: cover, cover;
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.snake-bg {
    background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
    background-image: url('images/40_Snake_Game.jpg'), linear-gradient(135deg, #30cfd0 0%, #330867 100%);
    background-size: cover, cover;
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.sensor-bg {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-image: url('images/22_SC207aH.jpg'), linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-size: cover, cover;
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.face-bg {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    background-image: url('images/43_RTOS_face.jpg'), linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    background-size: cover, cover;
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.ai-mentor-bg {
    background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
    /* 创业团队模拟器 - 紫蓝渐变 + emoji */
  }
  .card-image.mp3-bg {
    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    background-image: url('images/44_mp3Player2.jpg'), linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    background-size: cover, cover;
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.mjpeg-bg {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    background-image: url('images/32_DEMO_MJPEG.jpg'), linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    background-size: cover, cover;
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image.uidemo-bg {
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    background-image: url('images/42_demo_ui_lcd.jpg'), linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    background-size: cover, cover;
    background-position: center;
    background-repeat: no-repeat, no-repeat;
  }
  .card-image::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.1) 0%, transparent 60%);
  }

  /* 卡片左上角标签 */
  .card-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    background: var(--accent);
    color: #000;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  /* 卡片右上角版本号 */
  .card-version {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
  }

  /* 卡片中央图标占位 */
  .card-icon {
    font-size: 80px;
    opacity: 0.9;
    text-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  /* 卡片内容区 */
  .card-content {
    padding: 24px;
  }
  .card-title {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  .card-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .card-meta {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .card-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ============ 烧录视图 ============ */
  #flash-view { display: none; }
  #flash-view h2 {
    font-size: 20px;
    margin: 32px 0 12px;
    color: var(--accent);
  }

  /* 选中固件信息 */
  #selected-info {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
    font-size: 14px;
  }
  #selected-info b { color: var(--accent); }

  /* 表单控件 */
  select, button, input[type=checkbox] {
    font-family: inherit;
  }
  select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    margin-right: 12px;
  }
  button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #btn-connect {
    background: var(--accent);
    color: #000;
  }
  #btn-connect:hover:not(:disabled) {
    background: #1ea84d;
  }
  #btn-flash {
    background: #f59e0b;
    color: #000;
  }
  #btn-flash:hover:not(:disabled) {
    background: #d97706;
  }
  #chip-info {
    margin-left: 12px;
    color: var(--muted);
    font-size: 14px;
  }

  /* 分区列表 */
  #partition-list {
    background: var(--card);
    border-radius: 8px;
    padding: 16px;
    margin: 12px 0;
    font-size: 14px;
  }
  #partition-list code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    color: var(--accent);
  }

  /* 进度条 */
  .progress-container {
    background: #1f2937;
    border-radius: 8px;
    height: 32px;
    margin-top: 16px;
    overflow: hidden;
  }
  #progress {
    background: var(--accent);
    height: 100%;
    width: 0%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #000;
    transition: width 0.3s;
  }

  /* 日志终端 */
  #log {
    background: #000;
    color: #4ade80;
    font-family: ui-monospace, "Cascadia Code", monospace;
    font-size: 13px;
    padding: 16px;
    height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
    border-radius: 8px;
    margin-top: 16px;
    border: 1px solid #1f2937;
  }

  /* Badge Colors (type-specific) */
  .project-card .card-badge {
    background: #22c55e; /* firmware green (default) */
  }
  .project-card[data-type="web"] .card-badge {
    background: #3b82f6; /* web blue */
  }
  .project-card[data-type="android"] .card-badge {
    background: #f97316; /* android orange */
  }
  .project-card[data-type="windows"] .card-badge {
    background: #a855f7; /* windows purple */
  }

  /* Detail View Container */
  #detail-view {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .detail-container {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
  }

  /* Detail Header */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 32px;
    border-bottom: 1px solid var(--border);
  }

  .detail-icon {
    font-size: 48px;
    line-height: 1;
  }

  .detail-header-text {
    flex: 1;
  }

  .detail-title {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 8px 0;
    color: var(--text);
  }

  .detail-meta {
    font-size: 14px;
    color: var(--muted);
  }

  .detail-badge {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: white;
  }

  /* Detail Sections */
  .detail-section {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }

  .detail-section:last-of-type {
    border-bottom: none;
  }

  .detail-section-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 16px 0;
    color: var(--text);
  }

  /* Screenshots Grid */
  .detail-screenshots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .detail-screenshots-grid img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  /* Features List */
  .detail-features-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .detail-features-list li {
    padding: 8px 0;
    padding-left: 24px;
    position: relative;
  }

  .detail-features-list li:before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--primary);
    font-weight: bold;
  }

  /* Tech Stack Tags */
  .detail-tech-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .detail-tech-tags span {
    padding: 6px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
  }

  /* Changelog */
  .detail-changelog {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
  }

  .detail-changelog p {
    margin: 0 0 8px 0;
  }

  /* Download Actions */
  .detail-actions {
    padding: 24px 32px;
    text-align: center;
  }

  .detail-download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: var(--primary);
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: opacity 0.2s;
  }

  .detail-download-btn:hover {
    opacity: 0.9;
  }

  .detail-download-meta {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="env-banner"></div>

<!-- 导航栏 -->
<nav>
  <h1>🔧 固件烧录平台</h1>
  <button class="back-btn" id="btn-back" style="display:none;" onclick="showView('home')">← 返回首页</button>
</nav>

<!-- 首页视图 -->
<div id="home-view">
  <div class="wrap">
    <div class="hero">
      <h1>智能固件管理平台</h1>
      <p>选择产品 · 浏览器一键烧录 · 文件本地处理不上传</p>
    </div>

    <div class="category-tabs">
      <button class="tab active" data-filter="all" onclick="filterProjects('all')">全部</button>
      <button class="tab" data-filter="firmware" onclick="filterProjects('firmware')">固件</button>
      <button class="tab" data-filter="web" onclick="filterProjects('web')">网页</button>
      <button class="tab" data-filter="android" onclick="filterProjects('android')">Android</button>
      <button class="tab" data-filter="windows" onclick="filterProjects('windows')">Windows</button>
    </div>

    <div class="projects-grid" id="projects-grid"></div>
  </div>
</div>

<!-- 烧录视图 -->
<div id="flash-view">
  <div class="wrap">
    <div id="selected-info">未选择固件</div>

    <h2>01 · 连接设备</h2>
    <div style="margin-top:12px;">
      波特率:
      <select id="baud">
        <option selected>115200</option>
        <option>230400</option>
        <option>460800</option>
        <option>921600</option>
      </select>
      <button id="btn-connect">连接设备</button>
      <span id="chip-info"></span>
    </div>

    <h2>02 · 核对固件</h2>
    <div id="partition-list">请先选择固件</div>

    <h2>03 · 写入与重启</h2>
    <div style="margin-top:12px;">
      <label style="cursor:pointer;">
        <input type="checkbox" id="erase-all" style="margin-right:6px;">
        写入前擦除整片 flash
      </label>
    </div>
    <button id="btn-flash" style="margin-top:12px;">开始写入</button>

    <div class="progress-container">
      <div id="progress">0%</div>
    </div>

    <div id="log">等待连接设备...</div>
  </div>
</div>

<!-- Detail View -->
<div id="detail-view" style="display:none;">
  <div class="detail-container">
    <!-- Project Header -->
    <div class="detail-header">
      <div id="detail-icon" class="detail-icon"></div>
      <div class="detail-header-text">
        <h1 id="detail-title" class="detail-title"></h1>
        <div id="detail-meta" class="detail-meta"></div>
      </div>
      <div id="detail-badge" class="detail-badge"></div>
    </div>

    <!-- Screenshots Section -->
    <div class="detail-section">
      <h2 class="detail-section-title">📸 项目截图</h2>
      <div id="detail-screenshots" class="detail-screenshots-grid"></div>
    </div>

    <!-- Features Section -->
    <div class="detail-section">
      <h2 class="detail-section-title">✨ 核心功能</h2>
      <ul id="detail-features" class="detail-features-list"></ul>
    </div>

    <!-- Tech Stack Section -->
    <div class="detail-section">
      <h2 class="detail-section-title">🛠️ 技术栈</h2>
      <div id="detail-tech" class="detail-tech-tags"></div>
    </div>

    <!-- Changelog Section -->
    <div class="detail-section">
      <h2 class="detail-section-title">📝 版本历史</h2>
      <div id="detail-changelog" class="detail-changelog"></div>
    </div>

    <!-- Download/Launch Section -->
    <div class="detail-actions">
      <a id="detail-download-btn" class="detail-download-btn" href="#" download>
        <span id="detail-download-icon">⬇️</span>
        <span id="detail-download-text">下载</span>
      </a>
      <div id="detail-download-meta" class="detail-download-meta"></div>
    </div>
  </div>
</div>

<script type="module">

// ============ 环境检测 ============
const banner = document.getElementById("env-banner");
function checkEnv() {
  if (!("serial" in navigator)) {
    banner.className = "error";
    banner.textContent = "⚠ 当前浏览器不支持 Web Serial，请使用 Chrome 或 Edge 桌面版。";
    return false;
  }
  if (!window.isSecureContext) {
    banner.className = "error";
    banner.textContent = "⚠ 请通过 http://localhost 或 HTTPS 访问（不要直接双击打开 HTML 文件）。";
    return false;
  }
  banner.className = "ok";
  banner.textContent = "✓ 浏览器环境就绪";
  return true;
}
const envOk = checkEnv();

// ============ esptool-js 导入 ============

  try {
    // 优先加载本地离线文件
    esptoolModule = await import(ESPTOOL_LOCAL);
    log("esptool-js 加载成功 (本地离线版本)");
  } catch (localErr) {
    log("本地文件未找到，尝试从 CDN 加载...");
    try {
      esptoolModule = await import(ESPTOOL_CDN);
      log("esptool-js 加载成功 (CDN)");
    } catch (cdnErr) {
      log("esptool-js 加载失败: " + cdnErr.message);
    }
  }
  if (esptoolModule) {
    window.esptoolModule = esptoolModule;
    log("ESPLoader: " + (typeof esptoolModule.ESPLoader === "function" ? "OK" : "缺少"));
    log("Transport: " + (typeof esptoolModule.Transport === "function" ? "OK" : "缺失"));
  }
}

// ============ 视图切换 ============
function showView(viewName) {
  // Hide all views
  document.getElementById("home-view").style.display = "none";
  document.getElementById("flash-view").style.display = "none";
  document.getElementById("detail-view").style.display = "none";

  // Show back button for non-home views
  const backBtn = document.getElementById("btn-back");
  backBtn.style.display = (viewName === "home") ? "none" : "block";

  // Show target view
  if (viewName === "home") {
    document.getElementById("home-view").style.display = "block";
  } else if (viewName === "flash") {
    document.getElementById("flash-view").style.display = "block";
  } else if (viewName === "detail") {
    document.getElementById("detail-view").style.display = "block";
  }

  // Scroll to top
  window.scrollTo(0, 0);
}

// Expose to window
window.showView = showView;

function showDetail(id) {
  const project = PROJECTS.find(p => p.id === id);
  if (!project) return;

  const detailContainer = document.getElementById("detail-container");

  // 构建详情页内容
  let techStack = '';
  if (project.type === 'web') {
    techStack = '<div class="detail-tech"><span>🌐 Web 应用</span><span>浏览器直接访问</span></div>';
  } else if (project.type === 'android') {
    techStack = `<div class="detail-tech"><span>🤖 Android</span><span>最低系统: ${project.minAndroid || 'Android 8.0'}</span></div>`;
  } else if (project.type === 'windows') {
    techStack = `<div class="detail-tech"><span>🪟 Windows</span><span>最低系统: Windows ${project.minWindows || '10'}</span><span>文件大小: ${project.fileSize || 'N/A'}</span></div>`;
  }

  let actionButton = '';
  if (project.type === 'web') {
    actionButton = `<a href="${project.url}" target="_blank" class="detail-download-btn">🌐 打开应用</a>`;
  } else if (project.downloadUrl) {
    actionButton = `<a href="${project.downloadUrl}" class="detail-download-btn">📥 下载安装包</a>`;
  } else {
    actionButton = `<button class="detail-download-btn" disabled style="opacity: 0.5; cursor: not-allowed;">暂未提供下载</button>`;
  }

  detailContainer.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon">${project.icon || '📦'}</div>
      <div>
        <h2 class="detail-title">${project.name}</h2>
        <div class="detail-version">${project.version} · ${project.badge}</div>
      </div>
    </div>
    <div class="detail-description">
      <p>${project.description}</p>
    </div>
    ${techStack}
    <div class="detail-actions">
      ${actionButton}
      <button onclick="showView('home')" class="detail-back-btn">返回首页</button>
    </div>
  `;
}

function createProjectCard(t) {
  const card = document.createElement("div");
  card.className = "project-card";
  card.setAttribute("data-type", t.type);
  card.onclick = () => {
    if (t.type === "firmware") {
      selectTarget(t.id);
      showView("flash");
    } else {
      showDetail(t.id);
      showView("detail");
    }
  };

  let metaHTML = '';
  if (t.type === 'firmware' && t.chip) {
    metaHTML = `
      <span>\u{1F50C} ${t.chip.toUpperCase()}</span>
      <span>\u{1F4BE} ${t.flashSize || ''}</span>`;
  } else if (t.type === 'web') {
    metaHTML = `<span>\u{1F310} Web</span>`;
  } else if (t.type === 'android') {
    metaHTML = `<span>\u{1F4F1} Android</span>`;
  } else if (t.type === 'windows') {
    metaHTML = `<span>\u{1F5A5}\u{FE0F} Windows</span>`;
  }

  card.innerHTML = `
    <div class="card-image ${t.bgClass || (t.id + '-bg')}">
      <div class="card-badge">${t.badge}</div>
      <div class="card-version">${t.version}</div>
      ${t.icon ? `<div class="card-icon">${t.icon}</div>` : ''}

    <div class="card-content">
      <div class="card-title">${t.name}</div>
      <div class="card-desc">${t.description}</div>
      <div class="card-meta">${metaHTML}</div>
    </div>
  `;
  return card;
}

function selectTarget(id) {
  selectedTarget = PROJECTS.find(t => t.id === id) || null;
  if (selectedTarget) {
    const rows = selectedTarget.partitions
      .map(p => `<div>${p.name} @ <code>0x${p.offset.toString(16)}</code> → ${p.file.split("/").pop()}</div>`)
      .join("");
    selInfoEl.innerHTML = `

        芯片: ${selectedTarget.chip.toUpperCase()} · Flash: ${selectedTarget.flashSize} · 模式: ${selectedTarget.flashMode.toUpperCase()} @ ${selectedTarget.flashFreq}
      </div>

    document.dispatchEvent(new CustomEvent("target-selected", { detail: selectedTarget }));
  }
}

// ============ 设备连接 ============
let transport = null, esploader = null, detectedChip = null;
const chipInfoEl = document.getElementById("chip-info");

async function connectDevice() {
  if (!esptoolModule) { log("esptool-js 未就绪"); return; }
  // 断开旧连接
  if (transport) {
    try {
      await transport.disconnect();
      log("已断开旧设备");
    } catch (e) {
      log("断开旧设备时出错（忽略）: " + e.message);
    }
    transport = null;
    esploader = null;
    detectedChip = null;
  }
  try {
    const port = await navigator.serial.requestPort();
    transport = new esptoolModule.Transport(port, true);
    esploader = new esptoolModule.ESPLoader({
      transport,
      baudrate: parseInt(document.getElementById("baud").value, 10),
      terminal: {
        clean() {},
        writeLine(d) { log(d); },
        write(d) { logEl.textContent += d; }
      },
    });
    log("正在连接并识别芯片...");
    detectedChip = await esploader.main();
    chipInfoEl.textContent = "已连接: " + detectedChip;
    log("芯片识别: " + detectedChip);
  } catch (e) {
    log("连接失败: " + e.message);
    chipInfoEl.textContent = "连接失败";
  }
}
document.getElementById("btn-connect").onclick = connectDevice;
window.connectDevice = connectDevice;

// ============ 分区手选 ============
let manualOverrides = {};
const partListEl = document.getElementById("partition-list");

function bufToBinStr(buf) {
  const bytes = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return s;
}

function renderPartitions() {
  if (!selectedTarget) { partListEl.textContent = "请先选择固件"; return; }
  partListEl.innerHTML = selectedTarget.partitions.map(p => `
    <div style="margin:8px 0;display:flex;align-items:center;gap:12px;">
      <code style="min-width:60px;">0x${p.offset.toString(16).padStart(5,"0")}</code>
      <span style="flex:1;">${p.name}</span>
      <span style="color:var(--muted);font-size:12px;">${manualOverrides[p.name] ? "✓ 手选文件" : p.file.split("/").pop()}</span>
      <input type="file" data-part="${p.name}" style="font-size:12px;">
    </div>`).join("");
  partListEl.querySelectorAll("input[type=file]").forEach(inp => {
    inp.onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      manualOverrides[e.target.dataset.part] = bufToBinStr(await f.arrayBuffer());
      log(`已用手选文件覆盖分区 ${e.target.dataset.part}: ${f.name}`);
      renderPartitions();
    };
  });
}
document.addEventListener("target-selected", () => {
  manualOverrides = {};
  renderPartitions();
});

// ============ 固件加载 ============
async function loadFileArray() {
  if (!selectedTarget) throw new Error("未选择固件目标");
  const arr = [];
  for (const p of selectedTarget.partitions) {
    let data;
    if (manualOverrides[p.name]) {
      data = manualOverrides[p.name];
    } else {
      const resp = await fetch(p.file);
      if (!resp.ok) throw new Error(`固件文件缺失: ${p.file} (${resp.status})，请手选文件`);
      data = bufToBinStr(await resp.arrayBuffer());
    }
    arr.push({ data, address: p.offset });
  }
  return arr;
}
window.loadFileArray = loadFileArray;

// ============ 固件写入 ============
const progressEl = document.getElementById("progress");

async function flashFirmware() {
  if (!esploader) { log("请先连接设备"); return; }
  if (!selectedTarget) { log("请先选择固件"); return; }
  // 芯片校验
  if (detectedChip && !detectedChip.toLowerCase().replace(/[-\s]/g,"").includes(selectedTarget.chip)) {
    if (!confirm(`识别到 ${detectedChip}，与目标 ${selectedTarget.chip} 不一致，仍要继续?`)) return;
  }
  try {
    const fileArray = await loadFileArray();
    log("开始写入，共 " + fileArray.length + " 个分区...");
    document.getElementById("btn-flash").disabled = true;
    // 重置进度条
    progressEl.style.width = "0%";
    progressEl.textContent = "0%";
    await esploader.writeFlash({
      fileArray,
      flashSize: selectedTarget.flashSize,
      flashMode: selectedTarget.flashMode,
      flashFreq: selectedTarget.flashFreq,
      eraseAll: document.getElementById("erase-all").checked,
      compress: true,
      reportProgress: (idx, written, total) => {
        const pct = Math.round((written / total) * 100);
        progressEl.style.width = pct + "%";
        progressEl.textContent = `分区${idx+1}/${fileArray.length} ${pct}%`;
      },
    });
    log("✓ 写入完成，正在硬复位重启...");
    // 硬复位：优先用 esptool 的 after()，失败则回退到 DTR/RTS 手动复位
    try {
      await esploader.after("hard_reset");
    } catch (resetErr) {
      log("after(hard_reset) 不可用，尝试 DTR/RTS 复位: " + resetErr.message);
      try {
        await transport.setDTR(false);
        await transport.setRTS(false);
      } catch (dtrErr) {
        log("自动复位失败，请手动按设备复位键: " + dtrErr.message);
      }
    }
    log("✓ 全部完成");
    // 复位后 esptool stub 已失效，必须重新连接才能再次烧录
    log("提示：如需再次烧录，请重新点击「连接设备」");
    esploader = null;
    detectedChip = null;
    chipInfoEl.textContent = "已烧录完成，重烧请重新连接";
  } catch (e) {
    log("✗ 写入失败: " + e.message);
  } finally {
    document.getElementById("btn-flash").disabled = false;
  }
}
document.getElementById("btn-flash").onclick = flashFirmware;
window.flashFirmware = flashFirmware;
