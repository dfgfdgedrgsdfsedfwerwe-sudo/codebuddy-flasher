
[env]
platform = espressif32@6.6.0
; platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = large_spiffs_16MB.csv
; board_build.filesystem = littlefs
board_build.filesystem = spiffs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	-w -g
	-DCORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-I src
[platformio]
; default_envs = 01_display_esp_expnader   ; 使用esp_IOexpnader库驱动扩展芯片 
; default_envs = 02_display_XL95x5_LTR303    ; 使用XL95x5库驱动扩展芯片 
; default_envs = 10_Lgfx_usage             ; 使用Lgfx库驱动点亮屏幕
; default_envs = 11_TFTeSPI_usage          ; 使用TFTeSPI库驱动点亮屏幕
; default_envs = 12_Arduino_gfx            ; 使用Arduino_gfx库驱动点亮屏幕
; default_envs = 20_button                 ; 按键使用案例，查看串口输出
; default_envs = 21_aht20                  ; 温湿度使用案例
; default_envs = 22_SC207aH                ; 加速度传感器测试，查看串口输出
; default_envs = 23_music_test             ; 音频输出基本测试,播放网络音乐
; default_envs = 30_lvgl_Gif               ; LVGL驱动并播放澎湃开机gif动图
; default_envs = 50_codebuddy              ; CodeBuddy 语音编程键盘 (有线 USB HID)
default_envs = 51_K10_wifi                ; CodeBuddy P1: 麦克风采集 + ESP-NOW + ADC四键 (当前项目)
; default_envs = 51_mic_wifi               ; CodeBuddy P1: 麦克风采集 + ESP-NOW 发送到 Dongle
; default_envs = 52_codebuddy_ai_box     ; CodeBuddy 移植版: 正点原子 ESP32-S3 BOX (触摸屏 + ES8311)
; default_envs = 53_esp32-fluidbox         ; ESP32 FluidBox: 物理流体粒子模拟 (触摸交互)
; default_envs = 31_png_browser            ; 基于LVGL的图片浏览器
; default_envs = 32_DEMO_MJPEG             ; 基于LVGL视频播放器演示
; default_envs = 40_Snake_Game             ; 按键使用案例
; default_envs = 41_Snake_Game2            ; 使用IO按键使用案例
; default_envs = 42_demo_ui_lcd            ; 基于LVGL的图形界面设计
; default_envs = 43_RTOS_face              ; 基于LVGL的mp3播放器
; default_envs = 44_mp3Player2             ; 基于LVGL的mp3播放器

src_dir = examples/${platformio.default_envs}

[env:01_display_esp_expnader]
[env:02_display_XL95x5_LTR303]
[env:10_Lgfx_usage]
[env:11_TFTeSPI_usage]
[env:12_Arduino_gfx]
[env:20_button]
[env:21_aht20]
[env:22_SC207aH]
[env:23_music_test]
[env:30_lvgl_Gif]
[env:31_png_browser]
[env:32_DEMO_MJPEG]
build_flags =
	${env.build_flags}
	-L lib/ESP32_JPEG/src/esp32s3  ;need to put the "ESP32_JPEG" libaray  to lib folder manually. https://github.com/esp-arduino-libs/ESP32_JPEG
    -llibesp_codec.a
lib_deps =
https://github.com/esp-arduino-libs/ESP32_JPEG
[env:40_Snake_Game]
[env:41_Snake_Game2]
[env:42_demo_ui_lcd]
[env:43_RTOS_face]
[env:44_mp3Player2]

[env:50_codebuddy]
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_TINYUSB_HID_ENABLED=1

[env:51_mic_wifi]
; 继承 [env] 基础配置 (PSRAM / CDC / 分区表等), 无需额外 flag

[env:51_K10_wifi]
; 同 51_mic_wifi, 但源目录为 examples/51_K10_wifi (含 ADC 四键扩展 + WS2812 RGB LED)
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0


[env:52_codebuddy_ai_box]
; CodeBuddy 移植版: 正点原子 ESP32-S3 BOX
; 硬件差异: ST7789 8080并口LCD + CHSC5432电容触摸 + ES8311音频codec + XL9555 IO扩展
; 功能: 保留所有K10功能 + 新增触摸屏交互 + 喇叭放音 + 动态配对协议
; 注: LovyanGFX/lvgl 使用 lib/ 下的本地库 (含定制 lv_conf.h), 不从库管理器下载
build_flags =
    ${env.build_flags}
    -DATK_BOX_HARDWARE=1

[env:53_esp32-fluidbox]
; ESP32 FluidBox 移植: 物理流体粒子模拟 (900粒子, 240×320, 自动重力动画)
; 原项目: https://github.com/V4C38/esp32-fluidbox
; 硬件: ATK BOX (ST7789 LCD, 无IMU)
; 特性: 双密度松弛SPH, 空间网格加速, 带渲染优化
build_flags =
    ${env.build_flags}
    -DATK_BOX_HARDWARE=1

