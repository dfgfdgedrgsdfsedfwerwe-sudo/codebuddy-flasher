<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - 5×5 Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 550px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            color: #776e65;
        }

        .score-container {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: #bbada0;
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            color: white;
        }

        .score-label {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
        }

        .subtitle {
            color: #776e65;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .new-game-btn {
            background: #8f7a66;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .new-game-btn:hover {
            background: #9f8a76;
        }

        .grid {
            background: #bbada0;
            border-radius: 12px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            position: relative;
            aspect-ratio: 1;
        }

        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            aspect-ratio: 1;
            transition: all 0.12s ease-in-out;
        }

        /* Minimal flat 配色方案 */
        .tile-2    { background: #eee4da; color: #776e65; }
        .tile-4    { background: #ede0c8; color: #776e65; }
        .tile-8    { background: #f2b179; color: #f9f6f2; }
        .tile-16   { background: #f59563; color: #f9f6f2; }
        .tile-32   { background: #f67c5f; color: #f9f6f2; }
        .tile-64   { background: #f65e3b; color: #f9f6f2; }
        .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 24px; }
        .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 24px; }
        .tile-512  { background: #edc850; color: #f9f6f2; font-size: 24px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 20px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 20px; }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 18px; }

        .new-tile { animation: appear 0.15s ease-in-out; }
        @keyframes appear {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .merged { animation: pop 0.15s ease-in-out; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .game-message {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.85);
            border-radius: 12px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        .game-message.active { display: flex; }

        .game-message p {
            font-size: 40px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 20px;
        }

        .footer {
            margin-top: 20px;
            color: #776e65;
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
        }

        kbd {
            background: #bbada0;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">得分</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">最高</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>
        <p class="subtitle">5×5 大棋盘 · 合并相同数字，冲击 2048！</p>
        <div class="controls-bar">
            <button class="new-game-btn" onclick="game.newGame()">新游戏</button>
        </div>
        <div class="grid" id="grid">
            <div class="game-message" id="message">
                <p id="message-text">游戏结束</p>
                <button class="new-game-btn" onclick="game.newGame()">再来一局</button>
            </div>
        </div>
        <div class="footer">
            使用方向键 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 移动方块<br>
            相同数字碰撞时合并，目标是拼出 2048
        </div>
    </div>

    <script>
        class Game2048 {
            constructor(size = 5) {
                this.size = size;
                this.grid = [];
                this.score = 0;
                this.best = localStorage.getItem('best2048') || 0;
                this.gameOver = false;
                this.won = false;

                this.initGrid();
                this.updateBest();
                this.setupKeyboard();
                this.render();
            }

            initGrid() {
                this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                this.addRandomTile();
                this.addRandomTile();
            }

            addRandomTile() {
                const emptyCells = [];
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.grid[i][j] === 0) {
                            emptyCells.push({r: i, c: j});
                        }
                    }
                }
                if (emptyCells.length > 0) {
                    const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                    return {r, c};
                }
                return null;
            }

            setupKeyboard() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver) return;

                    let moved = false;
                    switch(e.key) {
                        case 'ArrowUp':
                            e.preventDefault();
                            moved = this.move('up');
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            moved = this.move('down');
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            moved = this.move('left');
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            moved = this.move('right');
                            break;
                    }

                    if (moved) {
                        this.addRandomTile();
                        this.render();
                        this.checkGameState();
                    }
                });
            }

            move(direction) {
                const oldGrid = JSON.stringify(this.grid);

                switch(direction) {
                    case 'left':
                        this.moveLeft();
                        break;
                    case 'right':
                        this.grid = this.grid.map(row => row.reverse());
                        this.moveLeft();
                        this.grid = this.grid.map(row => row.reverse());
                        break;
                    case 'up':
                        this.transpose();
                        this.moveLeft();
                        this.transpose();
                        break;
                    case 'down':
                        this.transpose();
                        this.grid = this.grid.map(row => row.reverse());
                        this.moveLeft();
                        this.grid = this.grid.map(row => row.reverse());
                        this.transpose();
                        break;
                }

                return oldGrid !== JSON.stringify(this.grid);
            }

            moveLeft() {
                for (let i = 0; i < this.size; i++) {
                    let row = this.grid[i].filter(val => val !== 0);
                    for (let j = 0; j < row.length - 1; j++) {
                        if (row[j] === row[j + 1]) {
                            row[j] *= 2;
                            this.score += row[j];
                            row.splice(j + 1, 1);
                        }
                    }
                    while (row.length < this.size) {
                        row.push(0);
                    }
                    this.grid[i] = row;
                }
            }

            transpose() {
                const newGrid = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        newGrid[j][i] = this.grid[i][j];
                    }
                }
                this.grid = newGrid;
            }

            checkGameState() {
                // 检查是否达到 2048
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.grid[i][j] === 2048 && !this.won) {
                            this.won = true;
                            this.showMessage('你赢了！🎉');
                            return;
                        }
                    }
                }

                // 检查是否还能移动
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.grid[i][j] === 0) return;
                        if (j < this.size - 1 && this.grid[i][j] === this.grid[i][j + 1]) return;
                        if (i < this.size - 1 && this.grid[i][j] === this.grid[i + 1][j]) return;
                    }
                }

                this.gameOver = true;
                this.showMessage('游戏结束');
            }

            showMessage(text) {
                document.getElementById('message-text').textContent = text;
                document.getElementById('message').classList.add('active');
            }

            hideMessage() {
                document.getElementById('message').classList.remove('active');
            }

            render() {
                const gridEl = document.getElementById('grid');
                const messageEl = document.getElementById('message');
                gridEl.innerHTML = '';
                gridEl.appendChild(messageEl);

                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        const value = this.grid[i][j];

                        if (value !== 0) {
                            const tileClass = value <= 2048 ? `tile-${value}` : 'tile-super';
                            cell.classList.add(tileClass);
                            cell.textContent = value;
                        }

                        gridEl.appendChild(cell);
                    }
                }

                document.getElementById('score').textContent = this.score;
                this.updateBest();
            }

            updateBest() {
                if (this.score > this.best) {
                    this.best = this.score;
                    localStorage.setItem('best2048', this.best);
                }
                document.getElementById('best').textContent = this.best;
            }

            newGame() {
                this.score = 0;
                this.gameOver = false;
                this.won = false;
                this.hideMessage();
                this.initGrid();
                this.render();
            }
        }

        // 启动游戏
        const game = new Game2048(5);
    </script>
</body>
</html>
